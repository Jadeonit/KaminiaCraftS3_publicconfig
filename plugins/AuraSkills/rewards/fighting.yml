# Награды боя - линия рыцаря.
# Куда: plugins/AuraSkills/rewards/fighting.yml (замена, сделай бэкап).
# Дефолтные статы (crit_damage/regeneration) сохранены.
# +25 - это ярость рыцаря (та же мана MMOCore).
patterns:
  - type: stat
    stat: crit_damage
    value: 1
    pattern:
      interval: 1
  - type: stat
    stat: regeneration
    value: 1
    pattern:
      interval: 2
  - type: command
    executor: console
    command: 'mmocore admin mana give {player} 25'
    pattern:
      start: 3
      interval: 3
levels:
