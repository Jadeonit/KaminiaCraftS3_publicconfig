# Награды защиты - линия рыцаря.
# Куда: plugins/AuraSkills/rewards/defense.yml (замена, сделай бэкап).
# Дефолтные статы (toughness/health) сохранены.
# +25 - это ярость рыцаря (та же мана MMOCore).
patterns:
  - type: stat
    stat: toughness
    value: 1
    pattern:
      interval: 1
  - type: stat
    stat: health
    value: 0.4
    pattern:
      interval: 2
  - type: command
    executor: console
    command: 'mmocore admin mana give {player} 25'
    pattern:
      start: 3
      interval: 3
levels:
