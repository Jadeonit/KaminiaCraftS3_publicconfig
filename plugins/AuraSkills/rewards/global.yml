# Единая мана: фоновая награда за любой навык AuraSkills.
# Куда: plugins/AuraSkills/rewards/global.yml (замена).
# Классовые навыки дают свою ману из своих файлов, здесь только фон:
# +10 каждые 4 уровня остальных навыков (mining, fishing, excavation...).
# Основная мана = MMOCore. В AuraSkills config.yml: mana.enabled: false.
# Проверено по коду: mmocore admin <ресурс> <give|set|take> <игрок> <число>.
patterns:
  - pattern:
      start: 4
      interval: 4
    type: command
    executor: console
    command: 'mmocore admin mana give {player} 10'
