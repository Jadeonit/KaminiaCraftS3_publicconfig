# Награды ловкости - линия человека.
# Куда: plugins/AuraSkills/rewards/agility.yml (замена, сделай бэкап).
# Дефолтные статы (regeneration/wisdom) сохранены.
# +15 - это энергия человека (та же мана MMOCore).
patterns:
  - type: stat
    stat: regeneration
    value: 1
    pattern:
      interval: 1
  - type: stat
    stat: wisdom
    value: 1
    pattern:
      interval: 2
  - type: command
    executor: console
    command: 'mmocore admin mana give {player} 15'
    pattern:
      start: 3
      interval: 3
levels:
